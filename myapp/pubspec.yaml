name: myapp
description: "Offline-first personal finance management app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^17.2.3

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Database
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Charts
  fl_chart: ^1.2.0

  # HTTP/API
  http: ^1.2.1

  # Date Formatting
  intl: ^0.20.2

  # SVG Support
  flutter_svg: ^2.0.10+1

  # Animations
  lottie: ^3.1.2

  # Icons
  font_awesome_flutter: ^11.0.0

  # Biometric Authentication
  local_auth: ^3.0.1

  # Notifications
  flutter_local_notifications: ^21.0.0

  # File Export/Import
  csv: ^8.0.0
  excel: ^4.0.3
  pdf: ^3.11.0
  printing: ^5.13.1

  # Image Picker
  image_picker: ^1.1.2

  # Connectivity
  connectivity_plus: ^7.1.1

  # Loading Animations
  flutter_spinkit: ^5.2.1

  # UUID Generator
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive Code Generator
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700